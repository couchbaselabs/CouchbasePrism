name: Publish Docker image

# Matches couchbase-fhir-ce's registry/CI treatment: build on every push to
# main that touches the app or its image, publish to GHCR tagged with the
# VERSION file's contents and `latest`, so install.sh's default
# (PRISM_VERSION=latest) always resolves to the most recent build.
on:
  push:
    branches: [main]
    paths:
      - "prism/**"
      - "app/**"
      - "eval/**"
      - "design/**"
      - "docs/**"
      - "tests/**"
      - "manage.py"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - "VERSION"
      - "config.example.yaml"
      - ".github/workflows/publish.yml"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  # Hardcoded lowercase, not github.repository (CouchbasePrism has capitals
  # and GHCR rejects those) - must match install.sh's PRISM_IMAGE default.
  IMAGE_NAME: couchbaselabs/couchbaseprism

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read VERSION
        id: version
        run: echo "value=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
