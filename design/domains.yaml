# PRISM's domain topology - committed, not customer state, same category as
# design/fts-index.json and design/fts-catalog-index.json. This IS the
# reference architecture: which Couchbase scopes exist, one per domain, each
# with its own catalog/docs/dictionary/concepts collections and its own
# fts{Domain}/fts{Domain}Catalog index pair. A customer's Couchbase AI Data
# Plane workflow has to be pointed at exactly these scope/collection names for
# Initialize (and everything downstream of it) to find what it ingested.
#
# `default` is which domain the app and retrieval pipeline operate against
# until a domain selector exists in the UI - every domain listed here is real
# (Initialize provisions and rebuilds all of them), but only the default is
# wired into Q&A today.
#
# aws_folder is ordinary AWS folder notation (a real S3 prefix, e.g.
# "Prism/3M") - config.aws_folder() flattens "/" to "_" the same way the
# ingestion workflow's own path-segment join does. docs_index/catalog_index
# are the bare FTS index names Initialize creates per domain; keep them
# distinct across domains (fts{Domain}Docs / fts{Domain}Catalog) - two
# domains sharing an index name would silently clobber each other's index.
default: secfilings

domains:
  secfilings:
    aws_folder: Prism/3M
    docs_index: ftsSecfilingsDocs
    catalog_index: ftsSecfilingsCatalog
  iso20020:
    aws_folder: Prism/ISO20020
    docs_index: ftsIso20020Docs
    catalog_index: ftsIso20020Catalog
