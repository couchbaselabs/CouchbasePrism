# One entry per source PDF in pdfs/{company}/. Only fields PRISM cannot derive
# itself belong here - company, doc_type, and period end date come from
# PRISM's own catalog extraction (prism/catalog/extraction.py) and are
# scored against, not hand-supplied. `company` below is the one exception,
# and it stays unscored on purpose: it's read only as the adapter's own
# --company filter, never compared against what extraction produces.
# `sector` is the same story - it isn't printed on any cover page, so it
# cannot come from extraction either way.
#
# doc_name     matches the PDF's filename (without .pdf) under pdfs/{company}/
#              and the doc_name used in questions/*.yaml.
# company      convenience filter only - see note above. Not scored.
# source_url   the exact SEC EDGAR filing (or specific exhibit, for an
#              earnings 8-K) this PDF was pulled from. Required - provenance
#              is always one click away, and the PDF is always
#              re-downloadable without depending on this repo's copy of it.
# sector       external classification (not printed on the cover page).
# added_by/added_at   who added this document, and when.
#
# 3M's 64 filings below (10-K, 10-Q, earnings-release 8-Ks, DEF 14A;
# FY2020-2025 complete, FY2026 current) were fetched via fetch_filings.py:
#   python fetch_filings.py --ticker MMM --label 3M --forms 10-K,10-Q --years 2020-2026 --go
