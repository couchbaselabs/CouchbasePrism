#   python fetch_filings.py --ticker MMM --label 3M --forms "DEF 14A" --years 2020-2026 --go
#
# Three of the 8-Ks below (2022-02-11, 2022-04-26 dup, 2023-02-21) are short
# supplementary "mini" releases 3M filed close to a main quarterly release,
# not a fifth quarter's worth of content - flagged here for a look before
# questions get authored against them, not excluded automatically.

