number: 2
title: Operating Margin & Special Charges

category: single-doc-computed

doc_names:
  - 3M_2023_10K

question: >
  Calculate 3M's Operating Income (Loss) Margin for the full year 2023 on a
  GAAP basis, and explain the primary special charge driver that caused it
  to decline compared to FY2022.

intent: >
  The driver is a specific named litigation charge stated in prose pages
  away from the income statement's own numbers, not a generic "expenses
  rose" gloss. A system that cannot bind a financial-statement figure
  together with the reconciling narrative elsewhere in the filing produces
  nothing computed at all - observed live, twice - which is a quieter
  failure than a wrong number would be.

answer: |
  3M's full-year 2023 GAAP operating income (loss) margin was **-27.9%**
  (operating income (loss) of $(9,128) million on net sales of $32,681
  million).

  The primary driver of the decline was special charges for significant
  litigation: 2023 included approximately $15.2 billion pre-tax in
  litigation costs, comprising a $10.5 billion charge for the PWS
  Settlement and a $4.3 billion charge (inclusive of imputed interest) for
  the Combat Arms Earplugs (CAE) Settlement.

formula: (operating_income_loss / net_sales) * 100

evidence:
  - "3M_2023_10K: Page 82 · Consolidated Statement of Income (Loss) · table"
  - "3M_2023_10K: Page 36 · Overview · text"

verified: true

notes: >
  -9,128 / 32,681 * 100 = -27.93%, matching the -27.9% expected answer.

  Page numbers were corrected 2026-09-07 (44->82, 19->36) and verified live
  against the actual ingested chunks - the originally-cited pages held
  different tables/sections entirely; the text content itself was already
  an exact match.

  The FY2022 comparison itself (the filing's own prior-year column) was not
  independently re-verified during this schema migration - only the FY2023
  figures and the litigation-charge evidence above were. A future reader
  wanting the exact FY2022 margin should pull it from the same statement.

  Migrated from the pre-doc_names/answer schema 2026-09-11; authored
