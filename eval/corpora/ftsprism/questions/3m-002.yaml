number: 2
title: Operating Margin & Special Charges

category: single-doc-computed

doc_names:
  - 3M_2023_10K

question: >
  Calculate 3M's Operating Income (Loss) Margin for the full year 2023 on a
  GAAP basis, and explain the primary special charge driver that caused it
  to decline compared to FY2022.

intent: >
  The driver is a specific named litigation charge stated in prose pages
  away from the income statement's own numbers, not a generic "expenses
  rose" gloss. A system that cannot bind a financial-statement figure
  together with the reconciling narrative elsewhere in the filing produces
  nothing computed at all - observed live, twice - which is a quieter
  failure than a wrong number would be.

answer: |
  3M's full-year 2023 GAAP operating income (loss) margin was **-27.9%** -
  an operating loss of $(9,128) million on net sales of $32,681 million. The
  filing prints this margin directly rather than leaving it to be derived.

  The primary driver was net costs for significant litigation, which
  accounted for **$14,869 million** of special-item charges *at the operating
  income line*. The same item is $15,245 million at the income-before-taxes
  line - the "approximately $15.2 billion pre-tax" the MD&A Overview cites -
  with the $376 million difference being imputed interest and other
  components below the operating line, which do not affect operating margin.
  That $15.2 billion comprises the PWS Settlement ($10.5 billion) and the
  Combat Arms Earplugs Settlement ($4.3 billion, inclusive of imputed
  interest). Excluding all special items, adjusted operating margin was 20.3%.

formula: (operating_income_loss / net_sales) * 100

evidence:
  - "3M_2023_10K: Page 47 · Certain amounts adjusted for special items (non-GAAP measures) - Total Company · table"
  - "3M_2023_10K: Page 82 · Consolidated Statement of Income (Loss) · table"
  - "3M_2023_10K: Page 37 · Overview - costs for significant litigation · text"

verified: true

