verified: true

notes: >
  #Michael F. Roman# in the question forces an exact-phrase match into
  retrieval's lexical channel (see prism/retrieval's forced_phrases
  mechanism) - useful here since "CEO" alone could plausibly match a
  different named executive's own compensation table elsewhere in the same
