question: >
  Under the 2022 Annual Incentive Plan (AIP), what performance metrics and
  weightings were used to evaluate the business performance factor for 3M's
  Chief Executive Officer, #Michael F. Roman#?

intent: >
  The metrics and weightings are sitting right there in the retrieved
  text - the failure mode this catches is not missing evidence, it's
  giving up: a system that reports "the excerpts do not state this" when a
  three-row table with three percentages was retrieved but never
  confidently enumerated. Observed live before a synthesis prompt fix.

answer: |
  Under the 2022 Annual Incentive Plan (AIP), the business performance
  factor for 3M's Chief Executive Officer, Michael F. Roman, was evaluated
  using these performance metrics and weightings:

  - Local Currency Sales (of 3M or a business unit, as applicable) vs. Plan — 50%
  - Operating Income (of 3M or a business unit, as applicable) vs. Plan — 30%
  - 3M Operating Cash Flow Conversion vs. Plan — 20%

  This factor was then adjusted by an Individual Performance Multiplier
  (+/- 20%) and an ESG Modifier (+/- 10% of target).

formula: null

