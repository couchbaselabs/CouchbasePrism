# TEMPLATE - copy this file, rename to the next free number (3m-002.yaml,
# 3m-003.yaml, ...). Leading "_" files (this one included) are ignored by the
# loader, so the template is never picked up as a real question.
#
# Fill in every field, then delete these comments.

number: 0                     # drives ordering in the UI dropdown; keep unique
title: REPLACE_ME             # short label shown in the dropdown - a noun
                              # phrase ("Effective Tax Rate"), not a sentence

category: REPLACE_ME          # ONE of, and nothing else:
                              #   single-doc-extraction   find the fact in one filing
                              #   single-doc-computed     formula, no approved entry
                              #   governed-formula        dictionary entry governs it
                              #   phrase-precision        exact strings BM25 pins
                              #   concept-semantic        no lexical anchor; vector carries it
                              #   multi-doc-range         spans filings (map/reduce)

doc_names:                    # ALWAYS a list, even for one document - one type
  - REPLACE_ME                # for the loader to handle. Each name must match
                              # an entry in ../documents.yaml.

question: >
  Write an ORIGINAL question in your own words, as a finance analyst would
  actually ask it, drafted against the filing itself.
  #
  # NO VAGUE QUANTIFIERS. "largest", "main", "primary", "key", "significant"
  # make a gold ungradeable, because a correct-but-partial answer can be
  # scored either way. Measured: asking for the "largest" items reconciling
  # 3M's FY2025 tax rate returned 6 of 8 - it read "largest" as a threshold
  # and cut everything under 1.0, and the items then did not sum to the
  # stated rate. Rewording to "the items" returned all nine. Ask for what you
  # actually want counted.

answer: |
  Markdown. Renders in the UI, so use a table when the source is a table -
  it makes a wrong total visible at a glance.

  Quote the source's OWN printed row labels verbatim ("Nontaxable or
  nondeductible items", not "non-deductible expenses"), and keep every
  column the source shows. That is what makes this checkable line-by-line
  against the filing.

formula: null                 # the exact expression producing the answer, e.g.
                              # "(total_current_assets - inventory) / total_current_liabilities"
                              # Identifier-based, not numbers-substituted.
                              # null for a direct-extraction question.

evidence:                     # one line per location, "DOC: Page N · Section · type"
  - "REPLACE_ME: Page 0 · Section heading as printed · table"
                              # type is text | table | footnote, matching the
                              # ingested chunk's own type. Page numbers are PDF
                              # page indexes (1-indexed), NOT the filing's
                              # printed folio - those differ, and getting it
                              # wrong has bitten this corpus before.

verified: false               # true ONLY when the values and evidence have been
                              # checked against the actual filing - not merely
                              # because PRISM produced them. A wrong gold is worse
                              # than no gold: it passes silently, forever.

notes: >                      # optional - context for whoever reads this next.
  Anything a future author needs: how it was verified, arithmetic that should
  reconcile, a presentation quirk in the source, why a near-miss wording was
  rejected.
