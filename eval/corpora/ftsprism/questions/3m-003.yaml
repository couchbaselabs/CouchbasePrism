number: 3
title: Adjusted Free Cash Flow Conversion

category: single-doc-computed

doc_names:
  - 3M_8K_2023-07-25_000056_earnings

question: >
  What was 3M's reported Adjusted Free Cash Flow Conversion for the second
  quarter of 2023, and what formula was used to derive it?

intent: >
  The release defines more than one similarly-named conversion metric side
  by side, with different numerators and denominators. A system that grabs
  the nearest matching label instead of the one the question actually names
  computes a real, differently-signed number under the same metric name -
  observed live: -0.62 instead of 122%, from confusing this "adjusted" one
  with a plain "free cash flow conversion" defined elsewhere in the same
  document.

answer: |
  3M's reported Adjusted Free Cash Flow Conversion for Q2 2023 was **122%**,
  computed as Adjusted Free Cash Flow divided by Adjusted Net Income
  Attributable to 3M.

  For the three months ended June 30, 2023: Adjusted free cash flow was
  $1,463 million and Adjusted net income attributable to 3M was $1,204
  million ($1,463M / $1,204M = 121.5%, rounding to the 122% the release
  itself prints).

formula: (adjusted_free_cash_flow / adjusted_net_income_attributable_to_3m) * 100

evidence:
  - "3M_8K_2023-07-25_000056_earnings: Page 24 · Adjusted Free Cash Flow (non-GAAP measure) · table"

verified: true

notes: >
  1,463 / 1,204 * 100 = 121.51%, close enough to the 122% the release
  itself states (rounding) that both the printed and computed readings
  agree - no printed-vs-computed ambiguity here.

  Migrated from the pre-doc_names/answer schema 2026-09-11; authored
  2026-09-07 (gemini+prasad, manual-curated).

  EVIDENCE CORRECTED 2026-09-11 (page 11 -> 24), verified by PyMuPDF text
  extraction. Page 24 is the only page carrying both $1,463 and $1,204; its
  printed heading is "Adjusted Free Cash Flow (non-GAAP measure)" and it
  states 122% / 72% / 105% / 61% across the four periods. Page 11 was the
  release's own PRINTED page number, not the PDF page index - the same
  systematic confusion found across this corpus.
