number: 5
title: Working Capital Growth FY2023 → FY2024

category: single-doc-computed

doc_names:
  - 3M_2024_10K

question: >
  By what percentage did 3M's working capital increase between
  December 31, 2023 and December 31, 2024, based on the company's
  non-GAAP definition, and what balance-sheet changes did management
  identify as the primary drivers?

intent: >
  3M prints its own "working capital (non-GAAP measure)" figure directly -
  a system that instead reconstructs working capital from its own
  definition of the components (receivables, inventory, payables...)
  computes a materially different, wrong-signed percentage change under
  the same label. Observed live: two candidate formulas, one matching gold
  at 327.7%, the other landing near -74%.

answer: |
  3M's working capital increased from $1.082 billion at December 31, 2023
  to $4.628 billion at December 31, 2024, an increase of $3.546 billion, or
  approximately **327.7%**.

  Management attributed the increase primarily to lower current
  liabilities associated with discontinued operations, short-term
  borrowings and current portions of long-term debt, and liabilities
  related to the PWS settlement.

formula: >
  ((current_working_capital - prior_working_capital)
  / prior_working_capital) * 100

evidence:
  - "3M_2024_10K: Page 38 · Working capital (non-GAAP measure) · table"
  - "3M_2024_10K: Page 39 · Financial Condition and Liquidity · text"

verified: false

notes: >
  (4,628 - 1,082) / 1,082 * 100 = 327.72%, matching the 327.7% expected
  answer.

  Current assets: $15,884M (2024) vs $16,379M (2023). Current liabilities:
  $11,256M (2024) vs $15,297M (2023). Working capital: $4,628M vs $1,082M -
  both years' figures come from the SAME document's own comparative
  columns (a 10-K prints the current and prior year side by side), not two
  separate filings, so this is single-doc-computed, not multi-doc-range.

  Not yet human-verified against the actual filing (verified: false,
  carried over unchanged from the original authoring) - flip once checked.

